name: 'Common Setup'
description: 'Checkout and install dependencies'
runs:
  using: "composite"
  steps:
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Install Dependencies
      run: npm ci --include=dev
      env:
        FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
